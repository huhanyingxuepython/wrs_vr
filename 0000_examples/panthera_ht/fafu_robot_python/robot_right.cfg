limits.4   = -128.0000, 95.0000
limits.5   = -92.0000, 78.0000
# J6: 主臂示教, 限位适中 (拖动手感参考).
limits.6   = -110.0000, 112.0000
limits.7   = -114.9840, -1.8360

control_rate_hz = 250
max_torque_raw  = 0
use_async_rx    = true
trajectory_dt_s = 4.0
