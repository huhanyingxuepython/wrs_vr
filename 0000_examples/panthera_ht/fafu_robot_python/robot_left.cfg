# =============================================================================
#  robot_left.cfg — 左臂 (镜像从臂, COM6)
#  teleop_teach_mirror 默认自动加载; 也可用 --left-cfg 指定.
#  从臂 J6 下限放宽, 避免右腕负向旋转时 target 顶在 -110° 不动.
# =============================================================================

port      = auto
baudrate  = 4000000
motor_ids = 1, 2, 3, 4, 5, 6, 7
pos_unit  = degrees

limits.1   = -140.6880, 148.1400
limits.2   = -12.0000, 128.0000
limits.3   = -150.0000, 176.9760
limits.4   = -128.0000, 95.0000
limits.5   = -92.0000, 78.0000
# J6: 从臂镜像需更大负向行程 (日志: 右腕 -50° 时左 target≈-133°).
limits.6   = -140.0000, 112.0000
limits.7   = -114.9840, -1.8360

control_rate_hz = 250
max_torque_raw  = 0
use_async_rx    = true
trajectory_dt_s = 4.0
